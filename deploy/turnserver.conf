# coturn TURN 服务器配置（与信令服务 TURN_SHARED_SECRET 配对使用 HMAC 短期凭证）
# 仅监听 3478 UDP/TCP；TLS 可选，需要额外证书，先省略以免因缺证书启动失败
listening-port=3478

fingerprint
use-auth-secret

# 与 .env 里的 TURN_SHARED_SECRET 保持一致
static-auth-secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET

realm=share.example.com

# relay 端口范围（防火墙需放行 UDP）
min-port=49152
max-port=65535

# 生产建议保留以下项
no-cli
no-multicast-peers
stale-nonce=600
total-quota=100
